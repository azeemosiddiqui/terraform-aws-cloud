version: 0.2

phases:

  install:
    commands:
      - echo "Installing Terraform..."
      - curl -LO https://releases.hashicorp.com/terraform/1.12.2/terraform_1.12.2_linux_amd64.zip
      - unzip -o terraform_1.12.2_linux_amd64.zip
      - mv terraform /usr/local/bin/
      - terraform version

  build:
    commands:
      - echo "Terraform PLAN Stage"
      - cd project3-vpc-toset-10Aug26
      - terraform init
      #- terraform fmt -check
      #- terraform validate
      - terraform plan -out=tfplan

artifacts:
  files:
    - '**/*'
